services:
  redpanda:
    image: redpandadata/redpanda:v25.3.1
    container_name: vex-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      # vex-server publishes on the network listener; the integration suite runs on the host
      # and reads the events back on the host listener.
      - --kafka-addr
      - internal://0.0.0.0:9092,host://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,host://localhost:19092
      # As in every environment, topics come only from deploy/kafka/topics.toml, which xtask
      # applies before vex-server starts: a topic deleted while the core runs stalls it instead
      # of coming back with default settings.
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"
      # The built-in Schema Registry, for applying the subjects' compatibility from the host.
      - "18081:8081"
    networks:
      - vex-testing-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-driver:
    build:
      context: .
      dockerfile: media-driver.Dockerfile
    container_name: media-driver
    # Build-time only: exporting the driver must never be part of a runtime `up`,
    # because it writes over the binary the host may already be executing.
    profiles: ["build-tools"]
    volumes:
      - ./bin/:/output
    # This service runs once to generate code, then exits
    restart: "no"

  # The media driver vex-server uses, with the Aeron Archive that journals its commands
  # (archive.Dockerfile). vex-server joins its network and IPC namespaces, so the driver, the
  # archive and the journal outlive a vex-server that is killed and restarted, as they do in
  # production.
  aeron-archive:
    build:
      context: .
      dockerfile: archive.Dockerfile
    container_name: vex-aeron-archive
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-test-server/cnc.dat"]
      interval: 2s
      timeout: 3s
      retries: 30
    ipc: shareable
    shm_size: '512m'
    networks:
      vex-testing-net:
        ipv4_address: 172.28.1.10

  vex-server:
    build:
      context: ../../
      dockerfile: xtask/tests/server.Dockerfile
    container_name: vex-server
    depends_on:
      redpanda:
        condition: service_healthy
      aeron-archive:
        condition: service_healthy
    environment:
      - VEX_ENV=development
      - VEX_SERVER_HOST=vex-server
      - VEX_SERVER_PORT=3521
      - VEX__KAFKA_BROKER=redpanda:9092
      # Redpanda's built-in Schema Registry (enabled on port 8081 by the image's default config).
      - VEX__SCHEMA_REGISTRY_URL=http://redpanda:8081
      - LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
      - RUST_LOG=debug
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x test_server && test -f /dev/shm/aeron-test-server/cnc.dat"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # The archive's media driver does vex-server's networking (it answers on the archive's
    # address, 172.28.1.10) and holds its shared memory.
    network_mode: "service:aeron-archive"
    ipc: "service:aeron-archive"
    privileged: true
    volumes:
      - ./test-results:/results

  vex-client:
    build:
      context: ../../
      dockerfile: ./xtask/tests/client.Dockerfile
    # container_name: vex-client
    environment:
      # Config for the client to find the server (use static IP; Aeron C driver can't resolve Docker DNS names)
      - VEX_SERVER_HOST=172.28.1.10
      - VEX_SERVER_PORT=3521
      - AERON_DIR=/dev/shm/aeron-test-client
      - LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
      - RUST_LOG=debug
    ipc: shareable
    privileged: true
    shm_size: '512m'
    volumes:
      - ./test-results:/results
    networks:
      - vex-testing-net

networks:
  vex-testing-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
