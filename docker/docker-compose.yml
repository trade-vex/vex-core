version: '3.8'

services:
  # Aeron Media Driver - built from source
  media-driver:
    build:
      context: ./media-driver
      dockerfile: Dockerfile
      cache_from:
        - ubuntu:22.04
    container_name: vex-media-driver
    shm_size: "512m"            # 🆕 Set shm-size like docker run
    ipc: "shareable"            # 🆕 Enable shared IPC namespace
    restart: unless-stopped
    environment:
      - AERON_DIR=/dev/shm/aeron
    volumes:
      - /dev/shm:/dev/shm

  # SBE Code Generator - generates Rust code from ordercmd.xml
  sbe-generator:
    build:
      context: ./sbe
      dockerfile: Dockerfile
    container_name: vex-sbe-generator
    volumes:
      - ../target/generated:/output
    # This service runs once to generate code, then exits
    restart: "no"

  # Exchange Core - built from source
  vex-core:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: vex-core
    depends_on:
      media-driver:
        condition: service_healthy
      sbe-generator:
        condition: service_completed_successfully
    environment:
      # Passed through from the calling shell, and required: development or test (see below).
      - VEX_ENV
      - RUST_LOG=info
      # This stack runs only a media driver, no Aeron Archive, so the archive channel is empty:
      # commands are not journaled and `--replay` is unavailable. Production rejects an empty
      # channel, so VEX_ENV=production fails at startup here.
      - VEX__CORE_NETWORKING__REQUEST_CONTROL_CHANNEL=
    volumes:
      - /dev/shm/aeron:/dev/shm/aeron
    restart: unless-stopped
    healthcheck:
      # vex-core always uses /dev/shm/aeron (src/main.rs); it does not read AERON_DIR.
      test: ["CMD-SHELL", "test -s /dev/shm/aeron/cnc.dat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
