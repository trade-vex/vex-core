version: '3.8'

services:
  # Aeron's ArchivingMediaDriver (aeron-all 1.49.0, the driver every stack runs; RUNBOOK): the
  # media driver vex-core uses, and the Aeron Archive that journals its commands. Its Aeron
  # directory is /dev/shm/aeron-test-server, in the host's /dev/shm.
  media-driver:
    build:
      context: ../xtask/tests
      dockerfile: archive.Dockerfile
    container_name: vex-media-driver
    shm_size: "512m"            # 🆕 Set shm-size like docker run
    ipc: "shareable"            # 🆕 Enable shared IPC namespace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-test-server/cnc.dat"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - /dev/shm:/dev/shm

  # SBE Code Generator - generates Rust code from ordercmd.xml. Nothing reads its output (the
  # codec is committed under order/src), so it runs only when named: `docker compose up sbe-generator`.
  sbe-generator:
    profiles: ["tools"]
    build:
      context: ./sbe
      dockerfile: Dockerfile
    container_name: vex-sbe-generator
    volumes:
      - ../target/generated:/output
    # This service runs once to generate code, then exits
    restart: "no"

  # Exchange Core - built from source
  vex-core:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: vex-core
    # Graceful shutdown can take ~45 s (RUNBOOK "Stop Service"); Docker's default is 10 s.
    stop_grace_period: 50s
    depends_on:
      media-driver:
        condition: service_healthy
    environment:
      # Passed through from the calling shell, and required: development or test.
      - VEX_ENV
      - RUST_LOG=info
      # The media driver's Aeron directory, instead of the image's /dev/shm/aeron. The archive
      # control channel is the development and test default, which the archive listens on.
      - VEX__CORE_NETWORKING__CONTEXT_DIR=/dev/shm/aeron-test-server
      # Kafka and its Schema Registry, passed through from the calling shell. This stack runs
      # neither; unset, the dev defaults point at localhost, which here is the container itself.
      - VEX__KAFKA_BROKER
      - VEX__SCHEMA_REGISTRY_URL
    volumes:
      - /dev/shm:/dev/shm
    restart: unless-stopped
