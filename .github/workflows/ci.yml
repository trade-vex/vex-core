name: Vex Core CI

on:
  push:
    branches:
      - main
      - develop
  # No base-branch filter. Stacked PRs are based on their predecessor, not on develop,
  # so a `branches:` filter here silently gives every PR above the bottom one zero checks.
  # `edited` is required as well: retargeting a stacked PR onto develop as the stack
  # merges is an edit, and the default event types do not include it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

# Per-PR, so restacking cancels only that PR's superseded runs. A workflow-wide group
# would discard other PRs' pending checks. Each push gets its own group (run_id): GitHub
# cancels a PENDING run whenever a newer one joins its group, even without
# cancel-in-progress, so a per-branch group would skip develop commits merged back to back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      redpanda:
        image: redpandadata/redpanda:v25.3.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: |
          wget https://github.com/rui314/mold/releases/download/v2.35.1/mold-2.35.1-x86_64-linux.tar.gz
          sudo tar -xzf mold-2.35.1-x86_64-linux.tar.gz -C /usr/local --strip-components=1
          rm mold-2.35.1-x86_64-linux.tar.gz

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl pkg-config libssl-dev uuid-dev ca-certificates make gcc g++ clang zlib1g-dev libbsd-dev python3-pip default-jdk protobuf-compiler
          # Install CMake 3.30+ (required by rusteron)
          pip3 install cmake --upgrade --break-system-packages || pip3 install cmake --upgrade
          cmake --version

      - name: Build workspace
        run: cargo build --workspace
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"

      - name: Build workspace (release)
        if: >-
          github.event_name != 'pull_request' ||
          github.base_ref == 'develop' ||
          github.base_ref == 'main'
        run: cargo build --workspace --release --all-features --all-targets
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
          VEX_KAFKA_BROKER: localhost:9092
          VEX_ENV: development

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: |
          wget https://github.com/rui314/mold/releases/download/v2.35.1/mold-2.35.1-x86_64-linux.tar.gz
          sudo tar -xzf mold-2.35.1-x86_64-linux.tar.gz -C /usr/local --strip-components=1
          rm mold-2.35.1-x86_64-linux.tar.gz

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl pkg-config libssl-dev uuid-dev ca-certificates make gcc g++ clang zlib1g-dev libbsd-dev python3-pip default-jdk protobuf-compiler
          # Install CMake 3.30+ (required by rusteron)
          pip3 install cmake --upgrade --break-system-packages || pip3 install cmake --upgrade
          cmake --version

      - name: Linting
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::must_use_candidate -A clippy::default_trait_access -A clippy::ignored_unit_patterns -A clippy::module_name_repetitions -A clippy::cast_possible_truncation
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"

      # vex-gateway compiles these crates (and their dependencies) with its own pinned
      # toolchain, 1.89.0 (vex-gateway rust-toolchain.toml). This job otherwise tests only
      # floating stable, so a change needing a newer Rust would pass here and break the
      # gateway only at its next re-pin. Keep this version in step with the gateway's.
      # rustfmt is required, not cosmetic: rusteron's build script pipes the generated Aeron
      # bindings through rustfmt and panics (broken pipe) when the toolchain lacks it.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Check gateway-facing crates with the gateway toolchain
        run: cargo +1.89.0 check --locked -p common -p sbe_order -p vex-config -p vex-networking

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'develop' ||
      github.base_ref == 'main'

    services:
      redpanda:
        image: redpandadata/redpanda:v25.3.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl pkg-config libssl-dev uuid-dev ca-certificates make gcc g++ clang zlib1g-dev libbsd-dev python3-pip default-jdk protobuf-compiler
          # Install CMake 3.30+ (required by rusteron)
          pip3 install cmake --upgrade --break-system-packages || pip3 install cmake --upgrade
          cmake --version
      # Pinned version plus checksum: an unpinned `cargo install` builds whatever crates.io
      # serves that day, which is neither reproducible nor fast.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - name: Generate code coverage
        run: |
          cargo llvm-cov --workspace --all-features --all-targets --exclude rusteron_client --text
        env:
          VEX_KAFKA_BROKER: localhost:9092
          VEX_ENV: development

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none
      - name: Run security audit
        run: cargo audit --deny warnings

  xtask-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'develop' ||
      github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl pkg-config libssl-dev uuid-dev ca-certificates make gcc g++ clang zlib1g-dev libbsd-dev python3-pip default-jdk protobuf-compiler
          # Install CMake 3.30+ (required by rusteron)
          pip3 install cmake --upgrade --break-system-packages || pip3 install cmake --upgrade
          cmake --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker layers for faster rebuilds
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Verify Docker is available
        run: |
          # Docker should already be running on GitHub Actions runners
          # This just verifies it's available
          docker info

      - name: Build Aeron and Docker images
        run: |
          # Use buildx cache for faster builds
          export DOCKER_BUILDKIT=1
          export BUILDX_CACHE_FROM="type=local,src=/tmp/.buildx-cache"
          export BUILDX_CACHE_TO="type=local,dest=/tmp/.buildx-cache-new,mode=max"

          # Export the media driver BEFORE anything runs it. The exporter mounts ./bin
          # and copies aeronmd into it, which is the same file the integration run
          # executes; doing this afterwards fails with ETXTBSY and takes vex-server down
          # with it through service_completed_successfully.
          docker compose --project-directory ./xtask/tests --file ./xtask/tests/docker-compose.yml run --rm --build --no-deps media-driver
          # Build with plain progress to see full compilation output
          docker compose --project-directory ./xtask/tests --file ./xtask/tests/docker-compose.yml --progress plain build vex-server vex-client

      - name: Run xtask unit tests
        run: cargo test --package xtask --lib

      - name: Run e2e tests
        run: cargo xtask test e2e --all

      - name: Run integration tests
        run: cargo xtask test integration --fail-fast
        env:
          VEX_ENV: development

      - name: Show failed test infrastructure
        if: failure()
        # Best-effort `ps`: the step runs under `bash -e`, so a failing `ps` would otherwise
        # end it before `logs`, the output this step exists for.
        run: |
          docker compose --project-directory ./xtask/tests --file ./xtask/tests/docker-compose.yml ps -a || true
          docker compose --project-directory ./xtask/tests --file ./xtask/tests/docker-compose.yml logs --no-color

      # Temp fix for cache growth - https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  # Single required check. Branch protection cannot express "these jobs, but only when
  # targeting develop", and a SKIPPED job satisfies an ordinary required-status rule --
  # which would let a tiered-out coverage or E2E job read as success. This decides
  # explicitly, and rejects an unexpected skip.
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [test, fmt, clippy, audit, coverage, xtask-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          required = ["test", "fmt", "clippy", "audit"]
          if os.environ["FULL"] == "true":
              required += ["coverage", "xtask-tests"]
          failed = [name for name in required if results[name]["result"] != "success"]
          if failed:
              print("Required jobs did not succeed:", ", ".join(failed))
              sys.exit(1)
          print("All required jobs succeeded:", ", ".join(required))
          PY
